<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Agent Contract Tester</title>
<meta name="description" content="Generate schema-contract tests for your AI agent tool outputs: JSON Schema validation, invariants, fuzz cases. Free tool by Zion Tech Group.">
<style>
:root{--bg:#0b0e13;--card:#141a24;--acc:#60a5fa;--txt:#e9f0fb;--mut:#93a2bb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#122c52,#0b0e13)}
h1{margin:0 0 8px}.wrap{max-width:960px;margin:0 auto;padding:24px}
.panel{background:var(--card);border:1px solid #20304a;border-radius:14px;padding:20px;margin-bottom:20px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px;border-radius:8px;border:1px solid #2a3d5c;background:#0e141d;color:var(--txt);font-family:ui-monospace,monospace}
button{margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#081426;font-weight:700;cursor:pointer}
pre{background:#0c1119;border:1px solid #20304a;border-radius:12px;padding:16px;font-size:.82rem;overflow:auto;max-height:440px}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #1a2536;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🤝 Zion Agent Contract Tester</h1>
<p>Paste a sample tool output (JSON). Get a JSON Schema contract plus generated test cases: valid, missing-field, wrong-type and boundary inputs.</p></header>
<div class="wrap">
<div class="panel">
<label>Tool name</label><input id="tool" value="get_order_status">
<label>Sample JSON output</label><textarea id="sample" style="min-height:160px">{"order_id":"A-1042","status":"shipped","eta_days":3,"refundable":true,"total_usd":129.9}</textarea>
<button onclick="gen()">Generate contract tests</button>
</div>
<div class="panel" id="result" style="display:none"><pre id="doc"></pre><button onclick="dl()">Download .py (pytest)</button></div>
</div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-agent-handoff-flow/">Handoff Designer</a>
<a href="https://ziontechgroup.com/zion-agent-observability/">Agent Observability</a>
<a href="https://ziontechgroup.com/zion-mcp-security/">MCP Security</a></footer>
<script>
function typ(v){return Array.isArray(v)?'array':v===null?'null':Number.isInteger(v)?'integer':typeof v;}
function gen(){
let obj;try{obj=JSON.parse(document.getElementById('sample').value);}catch(e){alert('Invalid JSON');return;}
const tool=document.getElementById('tool').value||'my_tool';
const props={},req=[],invariants=[];
for(const[k,v]of Object.entries(obj)){props[k]={type:typ(v)};req.push(k);
if(typeof v==='number'&&v>=0)invariants.push(`assert data["${k}"] >= 0  # ${k} should be non-negative`);
if(typeof v==='string'&&v)invariants.push(`assert isinstance(data["${k}"], str) and data["${k}"].strip()  # non-empty`);}
const schema={type:'object',required:req,properties:props,additionalProperties:true};
const py=`# Contract tests for tool: ${tool}
# Generated by Zion Agent Contract Tester — https://ziontechgroup.com/zion-agent-contract-tests/
import json, jsonschema, pytest

SCHEMA = ${JSON.stringify(schema,null,4)}

VALID_SAMPLE = json.loads('''${JSON.stringify(obj)}''')

def test_valid_output_conforms():
    jsonschema.validate(VALID_SAMPLE, SCHEMA)

@pytest.mark.parametrize("field", ${JSON.stringify(req)})
def test_missing_required_field_rejected(field):
    bad = {k: v for k, v in VALID_SAMPLE.items() if k != field}
    with pytest.raises(jsonschema.ValidationError):
        jsonschema.validate(bad, SCHEMA)

@pytest.mark.parametrize("field", ${JSON.stringify(req)})
def test_wrong_type_rejected(field):
    bad = dict(VALID_SAMPLE)
    bad[field] = {"unexpected": "object"}
    with pytest.raises(jsonschema.ValidationError):
        jsonschema.validate(bad, SCHEMA)

def test_domain_invariants():
    data = VALID_SAMPLE
${invariants.length?invariants.map(i=>'    '+i).join('\n'):'    pass  # add domain rules'}

def test_agent_graceful_on_contract_breach():
    """Agent must not act on invalid tool output — assert it escalates/retries."""
    # TODO: wire into your agent harness; see zion-agent-observability for monitoring.
    pass`;
document.getElementById('doc').textContent=py;document.getElementById('result').style.display='block';window._doc=py;}
function dl(){const b=new Blob([window._doc],{type:'text/x-python'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='test_tool_contract.py';a.click();}
</script>
</body>
</html>
